services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guesthouse
      POSTGRES_USER: guesthouse
      POSTGRES_PASSWORD: guesthouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guesthouse -d guesthouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://guesthouse:guesthouse@db:5432/guesthouse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: