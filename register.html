<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jisajili - Nginap Guest House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-language">
            <label class="language-switcher"><span aria-hidden="true">◎</span><select data-language-switch aria-label="Chagua lugha"><option value="sw">Kiswahili</option><option value="en">English</option></select></label>
        </div>
        <div class="auth-card">
            <div class="brand-logo">
                <div class="brand-heading"><h2><span data-brand-name>nginap</span><span>.</span></h2><button class="brand-edit-button" type="button" data-open-brand-dialog aria-label="Badilisha jina la guest house" title="Badilisha jina la guest house">✎</button></div>
                <p>Fungua akaunti mpya ya usimamizi.</p>
            </div>
            
            <form id="register-form">
                <div class="input-group">
                    <label>Jina Kamili</label>
                    <input type="text" id="reg-name" placeholder="Jina lako kamili" required>
                </div>

                <div class="input-group">
                    <label>Barua Pepe (Email)</label>
                    <input type="email" id="reg-email" placeholder="mteja@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Nenosiri (Password)</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary">Fungua Akaunti</button>
            </form>
            
            <div class="auth-footer">
                <p>Una akaunti tayari? <a href="index.html">Ingia hapa</a></p>
            </div>
            <div id="message" class="msg"></div>
        </div>
    </div>

    <script src="brand.js"></script>
    <script src="i18n.js"></script>
    <script src="api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                await apiRequest('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ full_name, email, password })
                });

                document.getElementById('message').style.color = '#059669';
                document.getElementById('message').innerText = 'Akaunti imefunguliwa kwa mafanikio. Tafadhali ingia.';
                window.setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
            } catch (error) {
                document.getElementById('message').style.color = '#dc2626';
                document.getElementById('message').innerText = error.message;
            }
        });
    </script>
</body>
</html>
