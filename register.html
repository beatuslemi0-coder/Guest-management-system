<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jisajili - Mfumo wa Nyumba za Wageni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-language">
            <label class="language-switcher">
                <span aria-hidden="true">◎</span>
                <select data-language-switch aria-label="Chagua lugha">
                    <option value="sw">Kiswahili</option>
                    <option value="en">English</option>
                </select>
            </label>
        </div>
        <div class="auth-card">
            <div class="brand-logo">
                <div class="brand-heading">
                    <h2><span data-brand-name>Guest House</span></h2>
                </div>
                <p>Fungua akaunti mpya ya usimamizi.</p>
            </div>
            
            <form id="register-form">
                <div class="input-group">
                    <label>Jina Kamili</label>
                    <input type="text" id="reg-name" placeholder="Jina lako kamili" required>
                </div>
                <div class="input-group">
                    <label>Jina la Nyumba ya Wageni (Guest House)</label>
                    <input type="text" id="reg-guesthouse" maxlength="60" placeholder="Mfano: Sunset Guest House" required>
                </div>

                <div class="input-group">
                    <label>Barua Pepe (Email)</label>
                    <input type="email" id="reg-email" placeholder="mteja@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Nenosiri (Password)</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary">Fungua Akaunti</button>
            </form>
            
            <div class="auth-footer">
                <p>Una akaunti tayari? <a href="index.html">Ingia hapa</a></p>
            </div>
            <div id="message" class="msg"></div>
        </div>
    </div>

    <script src="brand.js"></script>
    <script src="i18n.js"></script>
    <script src="api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('reg-name').value;
            const guesthouse_name = document.getElementById('reg-guesthouse').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const msgElement = document.getElementById('message');

            try {
                await apiRequest('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ full_name, guesthouse_name, email, password })
                });

                msgElement.style.color = '#059669';
                msgElement.innerText = 'Akaunti imefunguliwa kwa mafanikio. Tafadhali ingia.';
                
                window.setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);
            } catch (error) {
                msgElement.style.color = '#dc2626';
                msgElement.innerText = error.message || 'Imeshindikana kusajili!';
            }
        });
    </script>
</body>
</html>
